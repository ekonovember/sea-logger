name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Unit tests (host)
        run: pio test -e native
      - name: Build for NodeMCU v3
        run: pio run -e nodemcuv2

  tools:
    name: Tools (CSV -> GPX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
