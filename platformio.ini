; GPS track logger — NodeMCU v3 (ESP8266) + NEO-6M + SH1106 OLED + SD card.
;
;   pio run -e nodemcuv2              build the firmware
;   pio run -e nodemcuv2 -t upload    build and flash
;   pio test -e native                run the core unit tests on the host

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0
    plerup/EspSoftwareSerial@^6.16.1
    slashdevin/NeoGPS@^4.2.9
; NeoGPS reads its configuration from headers inside the library itself.
; Instead of asking you to edit them by hand after every clean build, this
; script copies the project's versions from config/neogps/ over them.
extra_scripts = pre:tools/apply_neogps_config.py
build_src_flags = -Wall -Wextra

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
